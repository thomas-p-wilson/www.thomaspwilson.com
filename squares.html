<style>
.item {
    box-shadow: 0px 2px 8px 0px rgba(0,0,0,0.3);
    position: absolute;
}
.hero {
    box-shadow: 0px 12px 20px 8px rgba(0, 0, 0, 0.07);
}
</style>

<script>
    // Generate random squares of varying shades and sizes


    // VARIABLES
    var hero_colors = {
        'FFE01B': 10,
        'F3773A': 5,
        'FFFFFF': 30
    };
    var colors = {
        'E6F5FF': 30,
        'E6FFF6': 40,
    }
    var base_size = 58;
    var hero_size = 76;
    var hero_chance = .03;
    var base_margin = 8;
    var base_radius = 5;
    var base_opacity = 0.5;

    // DO NOT CHANGE THE FOLLOWING
    var els = [];
    var hero_adjust = (hero_size - base_size) / 2;

    // Bounding box functionality
    function getElementBoundingRect(el) {
        var rect = el.getBoundingClientRect();
        if (el.classList.contains('hero')) {
            return {
                top: rect.top + hero_adjust,
                bottom: rect.bottom - hero_adjust,
                left: rect.left + hero_adjust,
                right: rect.right - hero_adjust,
            }
        }
        return rect;
    }

    function collides(el1, el2) {
        var rect1 = getElementBoundingRect(el1);
        var rect2 = getElementBoundingRect(el2);

        return !(rect1.top > rect2.bottom
            || rect1.right < rect2.left
            || rect1.bottom < rect2.top
            || rect1.left > rect2.right);
    }

    function collidesWithAny(el) {
        return els.some((target) => (collides(el, target)));
    }

    function boxIsEmpty(top, right, left, bottom) {
        return !els.some((target) => {
            var rect = getElementBoundingRect(target);
            return !(
                top > rect.bottom
                || right < rect.left
                || bottom < rect.top
                || left > rect.right
            )
        });
    }


    // Random functionality
    function random(opts) {
        var items = Object.keys(opts);
        var weights = Object.values(opts);
        var i;

        for (i = 0; i < weights.length; i++)
            weights[i] += weights[i - 1] || 0;
        
        var random = Math.random() * weights[weights.length - 1];
        
        for (i = 0; i < weights.length; i++)
            if (weights[i] > random)
                break;
        
        return items[i];
    }

    function random_opacity(hero = false) {
        if (hero) {
            return Math.random() + (.7 - .3) + .3;
        }
        return Math.random() * (base_opacity - 0) + 0;
    }

    function size(hero) {
        // if (hero) {
        //     return hero_size;
        // }
        return base_size;
    }

    function position(val, hero) {
        if (hero) {
            return val - ((hero_size - base_size) / 2);
        }
        return val;
    }

    function square(x, y, n) {
        var isHero = Math.random() < hero_chance;
        console.log('Square: ('+x+', '+y+')' + (isHero ? ' (hero)' : ''));
        var elem = document.createElement('div');
        elem.innerHTML = `${n}`;
        elem.style.cssText = 'top: '+y+'px; left: '+x+'px; width:'+base_size+'px; height:'+base_size+'px; background:#'+(isHero ? random(hero_colors) : random(colors))+'; opacity: '+random_opacity(isHero)+'; border-radius:'+base_radius+'px; '+(isHero ? 'transform: scale(1.3);' : '')+';';
        elem.classList.add('item');
        isHero && elem.classList.add('hero');
        document.body.appendChild(elem);
        if (!collidesWithAny(elem)) {
            els.push(elem);
        } else {
            document.body.removeChild(elem);
        }

        // For each available direction (WASD), recurse and generate a new square
        if (n > 0) {
            if (boxIsEmpty(y, x + base_size*2 + base_margin, x + base_size + base_margin, y + base_size)) {
                setTimeout(function() { square(x + base_size + base_margin, 0, n-1); }, 0); // right
            }
            if (boxIsEmpty(y + base_size + base_margin, x + base_size, x, y + base_size*2 + base_margin)) {
                setTimeout(function() { square(x, y + base_size + base_margin, n-1); }, 0); // down
            }
        }
    }

    square(0, 0, 15); // Start at top-left
</script>
